---
type: specs.openrewrite.org/v1beta/recipe
name: org.operaton.rewrite.upgrade.ReplaceOperatonBpmJunit5
displayName: Replace operaton-bpm-junit5 dependency
description: >-
  Removes the deprecated org.operaton.bpm:operaton-bpm-junit5 dependency and
  adds org.operaton.bpm:operaton-engine with the junit5 classifier if any of
  the relocated extension classes are used.
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.operaton.bpm
      artifactId: operaton-bpm-junit5
  - org.operaton.rewrite.upgrade.AddOperatonEngineJunit5IfUsed
